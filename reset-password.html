<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — The Lab</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{ --ink:#181512; --ink-2:#211D18; --paper:#F8F4EC; --gold:#FFC93C; --line:rgba(248,244,236,0.14); --dim:rgba(248,244,236,0.6); --error:#E4634F; --signal:#3FA679; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--paper); font-family:'IBM Plex Sans', sans-serif; min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;}
  header{padding:26px 28px;}
  .logo{display:flex; align-items:center; gap:8px; font-family:'Fraunces', serif; font-weight:800; font-size:20px; text-decoration:none; color:var(--paper); width:fit-content;}
  .logo-mark{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; background:var(--gold); border-radius:8px; color:var(--ink); font-family:'Fraunces',serif; font-weight:800;}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:20px 20px 60px;}
  .card{width:100%; max-width:400px; text-align:center;}
  h1{font-family:'Fraunces', serif; font-weight:800; font-size:28px; margin-bottom:8px;}
  .sub{color:var(--dim); font-size:14.5px; margin-bottom:32px;}
  .field{width:100%; background:var(--ink-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; color:var(--paper); font-size:15px; margin-bottom:14px; outline:none; text-align:left;}
  .field:focus{border-color:var(--gold);}
  .btn{width:100%; padding:14px; border-radius:10px; font-size:15px; font-weight:700; border:none; cursor:pointer; background:#FFFFFF; color:var(--ink);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .message{padding:12px 14px; border-radius:10px; font-size:13.5px; margin-top:16px; display:none; text-align:left;}
  .message.error{background:rgba(228,99,79,0.12); border:1px solid rgba(228,99,79,0.4); color:var(--error); display:block;}
  .message.success{background:rgba(63,166,121,0.12); border:1px solid rgba(63,166,121,0.4); color:var(--signal); display:block;}
  a{color:var(--gold);}
</style>
</head>
<body>

<header>
  <a href="landing.html" class="logo"><span class="logo-mark">L</span>The Lab</a>
</header>

<main>
  <div class="card" id="checkingCard">
    <h1>Checking your link…</h1>
    <p class="sub">One moment.</p>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <h1>Set a new password</h1>
    <p class="sub">Choose something you haven't used before.</p>
    <input type="password" class="field" id="newPassword" placeholder="New password (at least 6 characters)" oninput="toggleBtn()">
    <input type="password" class="field" id="confirmPassword" placeholder="Confirm new password" oninput="toggleBtn()">
    <button class="btn" id="saveBtn" disabled onclick="savePassword()">Set new password</button>
    <div class="message" id="messageBox"></div>
  </div>

  <div class="card" id="invalidCard" style="display:none;">
    <h1>This link isn't valid</h1>
    <p class="sub">Password reset links expire after a while, and only work once. <a href="signup.html?mode=login">Request a new one</a>.</p>
  </div>
</main>

<script>
  function toggleBtn(){
    const a = document.getElementById('newPassword').value;
    const b = document.getElementById('confirmPassword').value;
    document.getElementById('saveBtn').disabled = !(a.length >= 6 && a === b);
  }

  function showMessage(text, type){
    const box = document.getElementById('messageBox');
    box.textContent = text;
    box.className = 'message ' + type;
  }

  async function savePassword(){
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    if(password.length < 6){ showMessage('Password needs to be at least 6 characters.', 'error'); return; }
    if(password !== confirm){ showMessage("Those don't match — try again.", 'error'); return; }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const { error } = await supabaseClient.auth.updateUser({ password });
    if(error){
      showMessage(error.message || 'Could not update your password — try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Set new password';
      return;
    }

    showMessage('Password updated — taking you to your dashboard…', 'success');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
  }

  // Supabase's client library reads the recovery token straight out of
  // the URL fragment the email link lands on, and fires this event once
  // it's established a temporary "password recovery" session — that
  // session is only ever good for calling updateUser({password}), not
  // for anything else, and expires on its own shortly after.
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if(event === 'PASSWORD_RECOVERY'){
      document.getElementById('checkingCard').style.display = 'none';
      document.getElementById('formCard').style.display = 'block';
    }
  });

  // If the link was already expired/used, no PASSWORD_RECOVERY event ever
  // fires and no session appears — after a short wait, assume it's bad
  // rather than leave someone staring at "Checking your link…" forever.
  setTimeout(async () => {
    if(document.getElementById('formCard').style.display === 'none'){
      const { data } = await supabaseClient.auth.getSession();
      if(!data.session){
        document.getElementById('checkingCard').style.display = 'none';
        document.getElementById('invalidCard').style.display = 'block';
      }
    }
  }, 3000);
</script>
</body>
</html>
