<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{ --bg:#181512; --bg2:#211D18; --ink:#F8F4EC; --accent:#FFC93C; --line:rgba(248,244,236,0.14); --dim:rgba(248,244,236,0.6); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px; margin:0 auto; padding:48px 24px 80px;}
  #loading, #notfound{text-align:center; padding:100px 24px; color:var(--dim);}
  #content{display:none;}
  .toolbar{display:flex; justify-content:flex-end; margin-bottom:20px;}
  .toolbar button{background:none; border:1px solid var(--line); color:var(--ink); padding:9px 16px; border-radius:8px; font-size:13px; cursor:pointer;}
  header{display:flex; align-items:center; gap:18px; margin-bottom:28px;}
  .avatar{width:76px; height:76px; border-radius:50%; object-fit:cover; background:var(--bg2); flex-shrink:0;}
  h1{font-family:'Fraunces',serif; font-weight:800; font-size:26px;}
  .niche{color:var(--accent); font-size:13px; text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}
  .username{color:var(--dim); font-size:13px; margin-top:2px;}
  .intro{font-size:15px; line-height:1.6; color:var(--dim); margin-bottom:32px; white-space:pre-wrap;}
  h2{font-family:'Fraunces',serif; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:0.5px; color:var(--dim); margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px;}
  section{margin-bottom:32px;}
  .stats-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:16px;}
  .stat-card{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .stat-num{font-family:'Fraunces',serif; font-weight:800; font-size:22px; color:var(--accent);}
  .stat-label{font-size:11.5px; color:var(--dim); text-transform:uppercase; letter-spacing:0.3px; margin-top:2px;}
  .services{display:flex; flex-wrap:wrap; gap:8px;}
  .service-chip{background:var(--bg2); border:1px solid var(--line); padding:8px 14px; border-radius:20px; font-size:13px;}
  .socials{display:flex; flex-wrap:wrap; gap:14px; font-size:13.5px;}
  .socials a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line);}
  .contact-cta{background:var(--bg2); border:1px solid var(--accent); border-radius:14px; padding:20px; text-align:center;}
  .contact-cta a{display:inline-block; margin-top:10px; background:var(--accent); color:#181512; padding:11px 22px; border-radius:8px; font-weight:700; font-size:13.5px; text-decoration:none;}
  footer{text-align:center; color:var(--dim); font-size:11.5px; margin-top:40px;}
  footer a{color:var(--dim);}

  @media print {
    body{background:#fff; color:#181512;}
    .toolbar{display:none;}
    .stat-card, .service-chip{background:#F5F1E8; border-color:#ddd;}
    .contact-cta{background:#F5F1E8;}
    .stat-num{color:#181512;}
  }
</style>
</head>
<body>

<div id="loading" class="wrap">Loading…</div>
<div id="notfound" class="wrap" style="display:none;">This media kit doesn't exist or isn't public yet.</div>

<div id="content" class="wrap">
  <div class="toolbar">
    <button onclick="window.print()">Download / Print</button>
  </div>
  <header>
    <img class="avatar" id="kitAvatar" src="" alt="">
    <div>
      <h1 id="kitName"></h1>
      <div class="niche" id="kitNiche"></div>
      <div class="username" id="kitUsername"></div>
    </div>
  </header>

  <p class="intro" id="kitIntro"></p>

  <section id="statsSection">
    <h2>By the numbers</h2>
    <div class="stats-grid" id="kitStats"></div>
  </section>

  <section id="servicesSection">
    <h2>Services</h2>
    <div class="services" id="kitServices"></div>
  </section>

  <section id="socialsSection">
    <h2>Find me</h2>
    <div class="socials" id="kitSocials"></div>
  </section>

  <div class="contact-cta">
    <div>Interested in working together?</div>
    <a id="kitPortfolioLink" href="#">View full portfolio →</a>
  </div>

  <footer>Media kit generated by <a href="landing.html">The Lab</a></footer>
</div>

<script>
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function safeUrl(u){
    try{
      const parsed = new URL(u, window.location.href);
      return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '#';
    } catch(e){ return '#'; }
  }

  const STAT_LABELS = { followers:'Followers', views:'Total views', years:'Years creating' };

  async function load(){
    const params = new URLSearchParams(window.location.search);
    const username = (params.get('u') || '').toLowerCase().trim();

    if(!username){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notfound').style.display = 'block';
      return;
    }

    const { data: profileRow, error } = await supabaseClient
      .from('profiles_public')
      .select('*')
      .eq('username', username)
      .maybeSingle();

    if(error || !profileRow){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notfound').style.display = 'block';
      return;
    }

    const mediaKit = profileRow.media_kit || {};
    const stats = profileRow.stats || {};
    const social = profileRow.social || {};

    document.title = (profileRow.display_name || profileRow.username) + ' — Media Kit';
    document.getElementById('kitAvatar').src = profileRow.avatar_image || 'https://placehold.co/150x150/211D18/F8F4EC?text=' + encodeURIComponent((profileRow.display_name || profileRow.username || '?')[0].toUpperCase());
    document.getElementById('kitName').textContent = profileRow.display_name || profileRow.username;
    document.getElementById('kitNiche').textContent = profileRow.niche || '';
    document.getElementById('kitUsername').textContent = '@' + profileRow.username;
    document.getElementById('kitIntro').textContent = mediaKit.intro || profileRow.bio || '';
    document.getElementById('kitPortfolioLink').href = 'portfolio.html?u=' + encodeURIComponent(profileRow.username);

    const statEntries = Object.entries(stats).filter(([, v]) => v !== '' && v != null);
    document.getElementById('statsSection').style.display = statEntries.length ? 'block' : 'none';
    document.getElementById('kitStats').innerHTML = statEntries.map(([key, val]) => `
      <div class="stat-card"><div class="stat-num">${esc(val)}</div><div class="stat-label">${esc(STAT_LABELS[key] || key)}</div></div>
    `).join('');

    const services = mediaKit.services || [];
    document.getElementById('servicesSection').style.display = services.length ? 'block' : 'none';
    document.getElementById('kitServices').innerHTML = services.map(s => `<div class="service-chip">${esc(s)}</div>`).join('');

    const socialEntries = Object.entries(social).filter(([, v]) => v);
    document.getElementById('socialsSection').style.display = socialEntries.length ? 'block' : 'none';
    document.getElementById('kitSocials').innerHTML = socialEntries.map(([platform, value]) => {
      if(platform === 'email') return `<a href="mailto:${esc(value)}">Email: ${esc(value)}</a>`;
      return `<a href="${safeUrl(value)}" target="_blank" rel="noopener">${esc(platform.charAt(0).toUpperCase() + platform.slice(1))}</a>`;
    }).join('');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  load();
</script>
</body>
</html>
